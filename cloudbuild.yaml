steps:
  # 1. Build da imagem Docker de Produção
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'
      - '.'

  # 2. Push da imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'

  # 3. Deploy no Google Cloud Run (southamerica-east1 / São Paulo)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'erp-bancofe'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'NODE_ENV=production,PORT=3000,TZ=America/Sao_Paulo,OPENFINANCE_CLIENT_ID=bancofe-fapi-client-52889341,OPENFINANCE_CERT=ICP_BRASIL_BANCOFE_PROD_MTLS_V4,JUCEMAT_TOKEN=JUCEMAT_REDESIM_PROD_API_KEY_51,CAGED_TOKEN=MTE_CAGED_EMPREGOS_API_V2,DATAPREV_TOKEN=DATAPREV_INSS_CONSIGNADO_AUTH_V3'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'
