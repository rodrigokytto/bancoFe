steps:
  # 1. Build da imagem Docker de Produção
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'
      - '.'

  # 2. Push da imagem para o Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'

  # 3. Deploy no Google Cloud Run (southamerica-east1 / São Paulo)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'erp-bancofe'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:$SHORT_SHA'
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/bancofe/bancofe-erp:latest'

options:
  logging: CLOUD_LOGGING_ONLY
