version: '3.8'

services:
  bancofe-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bancofe-banking-engine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACEN_ISPB=00000799
      - BACEN_SPI_ENVIRONMENT=PRD
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - bancofe-network

networks:
  bancofe-network:
    driver: bridge
