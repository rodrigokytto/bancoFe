services:
  - type: web
    name: bancofe-core
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BACEN_ISPB
        value: "00000799"
      - key: LOG_LEVEL
        value: INFO
      - key: HOLDING_CNPJ
        value: "53338003000104"
      - key: TZ
        value: "America/Cuiaba"
