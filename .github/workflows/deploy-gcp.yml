name: Deploy BancoFe no GCP Cloud Run

on:
  push:
    branches:
      - main
      - prd
  workflow_dispatch:

concurrency:
  group: deploy-gcp-bancofe
  cancel-in-progress: true

env:
  PROJECT_ID: bancofe-plataforma-kytto
  GAR_LOCATION: southamerica-east1
  REPOSITORY: bancofe-repo
  SERVICE: erp-bancofe
  REGION: southamerica-east1

jobs:
  deploy:
    name: Build & Deploy Cloud Run (GCP São Paulo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticação Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Autenticar Docker com Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Garantir Repositório no Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |-
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Repositorio Docker BancoFe PRD" --quiet 2>/dev/null || true

      - name: Build e Push da Imagem Docker
        if: steps.auth.outcome == 'success'
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          LATEST="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy no Google Cloud Run
        if: steps.auth.outcome == 'success'
        run: |-
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 300 \
            --startup-probe-path=/healthz \
            --liveness-probe-path=/healthz \
            --set-env-vars NODE_ENV=production,PORT=3000,TZ=America/Sao_Paulo,OPENFINANCE_CLIENT_ID=bancofe-fapi-client-52889341,OPENFINANCE_CERT=ICP_BRASIL_BANCOFE_PROD_MTLS_V4,JUCEMAT_TOKEN=JUCEMAT_REDESIM_PROD_API_KEY_51,CAGED_TOKEN=MTE_CAGED_EMPREGOS_API_V2,DATAPREV_TOKEN=DATAPREV_INSS_CONSIGNADO_AUTH_V3
