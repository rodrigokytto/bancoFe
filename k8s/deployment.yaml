apiVersion: apps/v1
kind: Deployment
metadata:
  name: bancofe-banking-engine
  namespace: bancofe-prd
  labels:
    app.kubernetes.io/name: bancofe
    app.kubernetes.io/instance: prd
    app.kubernetes.io/component: core-banking
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bancofe
  template:
    metadata:
      labels:
        app: bancofe
    spec:
      containers:
        - name: bancofe-core
          image: rodrigokytto/bancofe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: BACEN_ISPB
              value: "00000799"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
