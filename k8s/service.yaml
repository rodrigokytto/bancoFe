apiVersion: v1
kind: Service
metadata:
  name: bancofe-service
  namespace: bancofe-prd
  labels:
    app: bancofe
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: bancofe
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bancofe-ingress
  namespace: bancofe-prd
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.bancofe.com.br
      secretName: bancofe-tls-cert
  rules:
    - host: app.bancofe.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bancofe-service
                port:
                  number: 80
