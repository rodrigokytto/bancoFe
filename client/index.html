<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BancoFe — Ecossistema Bancário &amp; Operações Financeiras</title>
    <script>
      window.global = window;
      window.process = window.process || {
        env: { NODE_ENV: 'production' },
        argv: [],
        platform: 'browser',
        version: '',
        versions: {},
        cwd: function() { return '/'; },
        nextTick: function(cb) { setTimeout(cb, 0); },
      };
    </script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA & Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c4a34" />
    <meta name="application-name" content="BancoFe" />

    <!-- Apple iOS Safari Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BancoFe" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script>
    (function() {
      function shouldSuppress(msg) {
        if (!msg) return false;
        var str = typeof msg === 'string' ? msg : (msg.message || (msg.toString ? msg.toString() : ''));
        return str.indexOf('Amplitude') !== -1 || 
               str.indexOf('remote config') !== -1 || 
               str.indexOf('Failed to fetch remote config') !== -1;
      }
      window.addEventListener('error', function(e) {
        if (shouldSuppress(e.message || e.error)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (shouldSuppress(e.reason)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro Automático do Service Worker PWA com Atualização Imediata -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch(err => {
              console.warn('[Zuma PWA] Falha no registro do Service Worker:', err);
            });
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
